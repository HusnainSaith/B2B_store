services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zerox-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zerox-net

  postgres:
    image: postgres:16-alpine
    container_name: zerox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zerox-net

  redis:
    image: redis:7-alpine
    container_name: zerox-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zerox-net

  # One-time seed runner: docker compose --profile seed run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    container_name: zerox-seed
    profiles: [seed]
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zerox-net
    working_dir: /app
    command: >
      sh -c "
        npm run seed:permissions &&
        npm run seed:role-permissions &&
        npm run seed:super-admin &&
        npm run seed:data
      "

volumes:
  pgdata:
  redisdata:

networks:
  zerox-net:
    driver: bridge
